services:
  chores-web:
    image: ghcr.io/vbbot/chores:latest
    container_name: chores-web
    restart: unless-stopped
    env_file:
      - ./chores.env
    environment:
      RECIPE_DB_PATH: /data/recipes.db
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/chores/firebase-admin.json:/run/secrets/firebase-admin.json:ro
      - /mnt/user/appdata/chores/recipes:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  chores-cron:
    image: ghcr.io/vbbot/chores:latest
    container_name: chores-cron
    restart: unless-stopped
    command: ["node", "scripts/cron.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      INTERNAL_APP_URL: http://chores-web:3000
    depends_on:
      chores-web:
        condition: service_healthy
