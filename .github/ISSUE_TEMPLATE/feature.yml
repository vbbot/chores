name: Feature
description: New capability or product improvement
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What problem does this solve?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth
        - Household
        - Chores
        - Bins
        - Shopping
        - Bills
        - Calendar
        - Notes
        - Infra
        - Mobile
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
    validations:
      required: true
